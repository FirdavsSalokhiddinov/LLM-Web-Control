<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 12px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px; margin-bottom: 8px; }
    button { width: 100%; padding: 6px; cursor: pointer; }
    #status { font-size: 12px; margin-top: 8px; }
    .ok { color: #2e7d32; }
    .bad { color: #cc0000; }
  </style>
</head>
<body>
  <h3>Claude Browser Control</h3>
  <label for="token">Bridge token</label>
  <input id="token" type="password" placeholder="paste token from server.js output" />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
